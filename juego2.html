<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perro en Moto - Tiesa Solution</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87CEEB;
    }

    #fondoNubes {
        position: absolute;
        width: 200%;
        height: 100%;
        background: url('nubes_mario.jpg') repeat-x;
        background-size: contain;
        animation: moverNubes 20s linear infinite;
        top: 0;
        left: 0;
        z-index: 0;
    }

    @keyframes moverNubes {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    #suelo {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 80px;
        background: #8B4513;
        border-top: 5px solid #5A2E0E;
        z-index: 1;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        z-index: 2;
    }

    #perro {
        position: absolute;
        width: 140px;
        height: 100px;
        background-image: url('perro_moto.jpg');
        background-size: cover;
        background-position: center;
        bottom: 80px;
        left: 50px;
        z-index: 9999;
    }

    .obstaculo {
        position: absolute;
        width: 60px;
        height: 60px;
        left: 100%;
        animation: mover 2s linear infinite;
        z-index: 3;
        background-size: cover;
    }

    .estrella {
        position: absolute;
        width: 50px;
        height: 50px;
        background-image: url('estrella.png');
        background-size: cover;
        left: 100%;
        animation: mover 3s linear infinite;
        z-index: 3;
    }

    @keyframes mover {
        from { left: 100%; }
        to { left: -80px; }
    }

    #puntuacion {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #000;
        z-index: 4;
    }

    #vidas {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 30px;
        color: gold;
        z-index: 4;
    }

    #gameOver {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        color: red;
        display: none;
        z-index: 4;
    }

    #reiniciarBtn, #volverBtn {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 25px;
        font-size: 20px;
        background: #222;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: none;
        z-index: 4;
    }

    #reiniciarBtn {
        top: 55%;
    }

    #volverBtn {
        top: 65%;
        background: #0055ff;
    }
</style>
</head>

<body>

<div id="fondoNubes"></div>
<div id="suelo"></div>

<div id="game">
    <div id="perro"></div>
    <div id="puntuacion">Puntos: 0</div>
    <div id="vidas">⭐ ⭐ ⭐</div>
    <div id="gameOver">GAME OVER</div>
    <button id="reiniciarBtn">Reiniciar juego</button>
    <button id="volverBtn">Volver al menú</button>
</div>

<script>
    const perro = document.getElementById("perro");
    const game = document.getElementById("game");
    const puntuacion = document.getElementById("puntuacion");
    const vidasTexto = document.getElementById("vidas");
    const gameOverText = document.getElementById("gameOver");
    const reiniciarBtn = document.getElementById("reiniciarBtn");
    const volverBtn = document.getElementById("volverBtn");

    const sonidoSalto = new Audio("salto.mp3");
    const sonidoChoque = new Audio("choque.mp3");

    let saltando = false;
    let puntos = 0;
    let vidas = 3;
    let juegoTerminado = false;

    function actualizarVidas() {
        vidasTexto.textContent = "⭐ ".repeat(vidas);
    }

    actualizarVidas();

    document.body.onclick = saltar;
    document.body.onkeydown = saltar;

    function saltar() {
        if (!saltando && !juegoTerminado) {

            sonidoSalto.currentTime = 0;
            sonidoSalto.play();

            saltando = true;
            let salto = 0;

            const intervalo = setInterval(() => {
                salto += 5;
                perro.style.bottom = (80 + salto) + "px";

                if (salto >= 140) {
                    clearInterval(intervalo);

                    const bajar = setInterval(() => {
                        salto -= 5;
                        perro.style.bottom = (80 + salto) + "px";

                        if (salto <= 0) {
                            clearInterval(bajar);
                            saltando = false;
                        }
                    }, 20);
                }
            }, 20);
        }
    }

    function crearObstaculo() {
        if (juegoTerminado) return;

        let obs = document.createElement("div");
        obs.classList.add("obstaculo");

        const imagenes = [
            "perro_carrito.png",
            "perro_masaje.jpg",
            "perro_queja.jpg",
            "logo_marca.jpg"
        ];

        const colores = ["red", "blue", "yellow", "green"];

        if (Math.random() < 0.5) {
            const elegido = imagenes[Math.floor(Math.random() * imagenes.length)];
            obs.style.backgroundImage = `url('${elegido}')`;
        } else {
            obs.style.backgroundImage = "none";
            obs.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
        }

        let tipo = Math.random() < 0.5 ? "bajo" : "alto";

        obs.style.bottom = tipo === "bajo" ? "80px" : "200px";

        game.appendChild(obs);

        puntos++;
        puntuacion.textContent = "Puntos: " + puntos;

        setTimeout(() => {
            obs.remove();
        }, 2000);
    }

    function crearEstrella() {
        if (juegoTerminado) return;

        let estrella = document.createElement("div");
        estrella.classList.add("estrella");
        estrella.style.bottom = Math.random() < 0.5 ? "200px" : "120px";

        game.appendChild(estrella);

        setTimeout(() => {
            estrella.remove();
        }, 3000);
    }

    setInterval(crearObstaculo, 1500);
    setInterval(crearEstrella, 5000);

    function actualizar() {
        if (juegoTerminado) return;

        document.querySelectorAll(".obstaculo, .estrella").forEach(obj => {
            let perroRect = perro.getBoundingClientRect();
            let objRect = obj.getBoundingClientRect();

            if (
                perroRect.left < objRect.right &&
                perroRect.right > objRect.left &&
                perroRect.top < objRect.bottom &&
                perroRect.bottom > objRect.top
            ) {
                if (obj.classList.contains("estrella")) {
                    if (vidas < 3) vidas++;
                    actualizarVidas();
                    obj.remove();
                } else {
                    perderVida();
                }
            }
        });

        requestAnimationFrame(actualizar);
    }

    function perderVida() {

        sonidoChoque.currentTime = 0;
        sonidoChoque.play();

        vidas--;
        actualizarVidas();

        if (vidas <= 0) {
            terminarJuego();
            return;
        }

        /* ⭐ REINICIO SEGURO PARA NO MORIR DE GOLPE */
        perro.style.bottom = "80px";
        perro.style.left = "50px";

        /* ⭐ Elimina obstáculos que estén tocando */
        document.querySelectorAll(".obstaculo").forEach(o => {
            let r = o.getBoundingClientRect();
            let p = perro.getBoundingClientRect();

            if (
                p.left < r.right &&
                p.right > r.left &&
                p.top < r.bottom &&
                p.bottom > r.top
            ) {
                o.remove();
            }
        });
    }

    function terminarJuego() {
        juegoTerminado = true;
        gameOverText.style.display = "block";
        reiniciarBtn.style.display = "block";
        volverBtn.style.display = "block";
    }

    reiniciarBtn.onclick = () => {
        juegoTerminado = false;
        puntos = 0;
        vidas = 3;
        puntuacion.textContent = "Puntos: 0";
        actualizarVidas();
        gameOverText.style.display = "none";
        reiniciarBtn.style.display = "none";
        volverBtn.style.display = "none";

        document.querySelectorAll(".obstaculo, .estrella").forEach(o => o.remove());

        perro.style.bottom = "80px";
        perro.style.left = "50px";

        actualizar();
    };

    volverBtn.onclick = () => {
        window.location.href = "index.html";
    };

    actualizar();
</script>

</body>
</html>
