<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perro en Moto - Tiesa Solution</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87CEEB; /* Cielo azul */
    }

    /* ⭐ Fondo con nubes estilo Mario */
    #fondoNubes {
        position: absolute;
        width: 200%;
        height: 100%;
        background: url('nubes_mario.jpg') repeat-x; /* ⭐ TU ARCHIVO REAL */
        background-size: contain;
        animation: moverNubes 20s linear infinite;
        top: 0;
        left: 0;
        z-index: 0;
    }

    @keyframes moverNubes {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        z-index: 1; /* El juego va encima del fondo */
    }

    /* 🐶 Perro en moto */
    #perro {
        position: absolute;
        width: 140px;
        height: 100px;
        background-image: url('perro_moto.png');
        background-size: cover;
        background-position: center;
        bottom: 50px;
        left: 50px;
        z-index: 2;
    }

    /* Obstáculo */
    .obstaculo {
        position: absolute;
        width: 50px;
        height: 50px;
        background: #333;
        bottom: 50px;
        left: 100%;
        animation: mover 2s linear infinite;
        z-index: 2;
    }

    @keyframes mover {
        from { left: 100%; }
        to { left: -60px; }
    }

    #puntuacion {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #000;
        z-index: 3;
    }

    #vidas {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 30px;
        color: gold;
        z-index: 3;
    }

    #gameOver {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        color: red;
        display: none;
        z-index: 3;
    }

    #reiniciarBtn {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 25px;
        font-size: 20px;
        background: #222;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: none;
        z-index: 3;
    }
</style>
</head>

<body>

<!-- ⭐ Fondo de nubes -->
<div id="fondoNubes"></div>

<div id="game">
    <div id="perro"></div>
    <div id="puntuacion">Puntos: 0</div>
    <div id="vidas">⭐ ⭐ ⭐</div>
    <div id="gameOver">GAME OVER</div>
    <button id="reiniciarBtn">Reiniciar juego</button>
</div>

<script>
    const perro = document.getElementById("perro");
    const game = document.getElementById("game");
    const puntuacion = document.getElementById("puntuacion");
    const vidasTexto = document.getElementById("vidas");
    const gameOverText = document.getElementById("gameOver");
    const reiniciarBtn = document.getElementById("reiniciarBtn");

    let saltando = false;
    let puntos = 0;
    let vidas = 3;
    let juegoTerminado = false;

    function actualizarVidas() {
        vidasTexto.textContent = "⭐ ".repeat(vidas);
    }

    actualizarVidas();

    /* ⭐ SALTO CON CLIC Y CON TECLADO */
    document.body.onclick = saltar;
    document.body.onkeydown = saltar;

    function saltar() {
        if (!saltando && !juegoTerminado) {
            saltando = true;
            let salto = 0;

            const intervalo = setInterval(() => {
                salto += 5;
                perro.style.bottom = (50 + salto) + "px";

                if (salto >= 120) {
                    clearInterval(intervalo);

                    const bajar = setInterval(() => {
                        salto -= 5;
                        perro.style.bottom = (50 + salto) + "px";

                        if (salto <= 0) {
                            clearInterval(bajar);
                            saltando = false;
                        }
                    }, 20);
                }
            }, 20);
        }
    }

    function crearObstaculo() {
        if (juegoTerminado) return;

        let obs = document.createElement("div");
        obs.classList.add("obstaculo");
        game.appendChild(obs);

        puntos++;
        puntuacion.textContent = "Puntos: " + puntos;

        setTimeout(() => {
            obs.remove();
        }, 2000);
    }

    setInterval(crearObstaculo, 1500);

    function actualizar() {
        if (juegoTerminado) return;

        document.querySelectorAll(".obstaculo").forEach(obs => {
            let perroRect = perro.getBoundingClientRect();
            let obsRect = obs.getBoundingClientRect();

            if (
                perroRect.left < obsRect.right &&
                perroRect.right > obsRect.left &&
                perroRect.top < obsRect.bottom &&
                perroRect.bottom > obsRect.top
            ) {
                perderVida();
            }
        });

        requestAnimationFrame(actualizar);
    }

    function perderVida() {
        vidas--;
        actualizarVidas();

        if (vidas <= 0) {
            terminarJuego();
        }
    }

    function terminarJuego() {
        juegoTerminado = true;
        gameOverText.style.display = "block";
        reiniciarBtn.style.display = "block";
    }

    reiniciarBtn.onclick = () => {
        juegoTerminado = false;
        puntos = 0;
        vidas = 3;
        puntuacion.textContent = "Puntos: 0";
        actualizarVidas();
        gameOverText.style.display = "none";
        reiniciarBtn.style.display = "none";

        document.querySelectorAll(".obstaculo").forEach(o => o.remove());

        perro.style.bottom = "50px";

        actualizar();
    };

    actualizar();
</script>

</body>
</html>
