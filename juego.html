<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego del Perro - Tiesa Solution</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #4CAF50; /* ⭐ Fondo verde */
        font-family: Arial, sans-serif;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
    }

    #perro {
        position: absolute;
        width: 60px;
        height: 60px;
        background-image: url('perro_camioneta.jpg');
        background-size: cover;
        top: 50%;
        left: 20%;
    }

    .obstaculo {
        position: absolute;
        width: 80px;
        background: green;
        left: 100%;
        animation: mover 3s linear infinite;
    }

    @keyframes mover {
        from { left: 100%; }
        to { left: -100px; }
    }

    #puntuacion {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: white;
    }

    #vidas {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 30px;
        color: gold;
    }

    #gameOver {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        color: red;
        display: none;
    }

    #reiniciarBtn, #volverBtn {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 25px;
        font-size: 20px;
        background: #222;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: none;
    }

    #volverBtn {
        top: 70%;
        background: #0055ff;
    }
</style>
</head>

<body>

<div id="game">
    <div id="perro"></div>
    <div id="puntuacion">Puntos: 0</div>
    <div id="vidas">⭐ ⭐ ⭐</div>
    <div id="gameOver">GAME OVER</div>
    <button id="reiniciarBtn">Reiniciar</button>
    <button id="volverBtn">Volver al menú</button>
</div>

<script>
    const perro = document.getElementById("perro");
    const game = document.getElementById("game");
    const puntuacion = document.getElementById("puntuacion");
    const vidasTexto = document.getElementById("vidas");
    const gameOverText = document.getElementById("gameOver");
    const reiniciarBtn = document.getElementById("reiniciarBtn");
    const volverBtn = document.getElementById("volverBtn");

    /* ⭐ SONIDOS AÑADIDOS */
    const sonidoSalto = new Audio("salto.mp3");
    const sonidoChoque = new Audio("choque.mp3");

    let velocidad = 0;
    let gravedad = 0.5;
    let puntos = 0;
    let vidas = 3;
    let juegoTerminado = false;

    function actualizarVidas() {
        vidasTexto.textContent = "⭐ ".repeat(vidas);
    }

    actualizarVidas();

    /* ⭐ SALTO CON CLIC Y TECLADO */
    document.body.onclick = saltar;
    document.body.onkeydown = saltar;

    function saltar() {
        if (!juegoTerminado) {
            sonidoSalto.currentTime = 0;
            sonidoSalto.play(); /* ⭐ Sonido de salto */
            velocidad = -10;
        }
    }

    function crearObstaculo() {
        if (juegoTerminado) return;

        let altura = Math.random() * 300 + 100;
        let hueco = 150;

        let arriba = document.createElement("div");
        arriba.classList.add("obstaculo");
        arriba.style.height = altura + "px";
        arriba.style.top = "0px";

        let abajo = document.createElement("div");
        abajo.classList.add("obstaculo");
        abajo.style.height = (window.innerHeight - altura - hueco) + "px";
        abajo.style.bottom = "0px";

        game.appendChild(arriba);
        game.appendChild(abajo);

        puntos++;
        puntuacion.textContent = "Puntos: " + puntos;

        setTimeout(() => {
            arriba.remove();
            abajo.remove();
        }, 3000);
    }

    setInterval(crearObstaculo, 2000);

    function actualizar() {
        if (juegoTerminado) return;

        velocidad += gravedad;
        perro.style.top = (perro.offsetTop + velocidad) + "px";

        if (perro.offsetTop > window.innerHeight || perro.offsetTop < 0) {
            perderVida();
        }

        document.querySelectorAll(".obstaculo").forEach(obs => {
            let perroRect = perro.getBoundingClientRect();
            let obsRect = obs.getBoundingClientRect();

            if (
                perroRect.left < obsRect.right &&
                perroRect.right > obsRect.left &&
                perroRect.top < obsRect.bottom &&
                perroRect.bottom > obsRect.top
            ) {
                perderVida();
            }
        });

        requestAnimationFrame(actualizar);
    }

    function perderVida() {

        sonidoChoque.currentTime = 0;
        sonidoChoque.play(); /* ⭐ Sonido de choque */

        vidas--;
        actualizarVidas();

        if (vidas <= 0) {
            terminarJuego();
        } else {
            velocidad = 0;
            perro.style.top = "50%";
        }
    }

    function terminarJuego() {
        juegoTerminado = true;
        gameOverText.style.display = "block";
        reiniciarBtn.style.display = "block";
        volverBtn.style.display = "block";
    }

    reiniciarBtn.onclick = () => {
        juegoTerminado = false;
        puntos = 0;
        vidas = 3;
        velocidad = 0;
        perro.style.top = "50%";
        puntuacion.textContent = "Puntos: 0";
        actualizarVidas();
        gameOverText.style.display = "none";
        reiniciarBtn.style.display = "none";
        volverBtn.style.display = "none";

        document.querySelectorAll(".obstaculo").forEach(o => o.remove());

        actualizar();
    };

    volverBtn.onclick = () => {
        window.location.href = "index.html";
    };

    actualizar();
</script>

</body>
</html>
