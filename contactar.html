<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiesa Solution - Contactar</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8eef7, #d4e1f5);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .contenedor {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        /* Bloque de información */
        .info-contacto {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            margin-bottom: 40px; /* MÁS SEPARACIÓN */
        }

        .info-contacto h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .info-contacto p {
            font-size: 17px;
            margin: 8px 0;
        }

        /* Recuadro del formulario */
        .formulario {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.20);

            width: 95%;          /* MÁS GRANDE */
            max-width: 1000px;   /* MÁS ANCHO */
            margin: 0 auto;      /* CENTRADO */
        }

        iframe {
            width: 100%;
            height: 750px; /* MÁS ALTO PARA NO HACER SCROLL */
            border: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Contactar</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="servicios.html">Servicios</a>
    <a href="contactar.html">Contactar</a>
    <a href="quejas.html">Quejas</a>
</nav>

<div class="contenedor">

    <!-- ⭐ BLOQUE DE INFORMACIÓN -->
    <div class="info-contacto">
        <h2>Información de contacto</h2>

        <p><i class="fas fa-phone"></i> Teléfono: 666 123 456</p>
        <p><i class="fas fa-envelope"></i> Email: tiesasolution@gmail.com</p>
        <p><i class="fas fa-map-marker-alt"></i> Ubicación: Mairena del Aljarafe</p>
        <p><i class="fas fa-clock"></i> Horario: L–V de 9:00 a 20:00</p>
    </div>

    <!-- ⭐ FORMULARIO -->
    <div class="formulario">
        <iframe src="TU_LINK_DE_GOOGLE_FORMS_AQUÍ"></iframe>
    </div>

</div>

</body>
</html>
